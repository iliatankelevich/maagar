name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # `make check` is the definition of done locally, so CI runs exactly it — lint, format,
      # typecheck, tests — rather than a parallel list that can drift from the Makefile.
      # No database needed: integration coverage lives in the consumer. See "Tests" in the README.
      - name: Every quality gate
        run: make check
